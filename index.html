/* ============================================================================
   NATURAL SCENT TRADING QATAR — CHARTS ENGINE
   رسوم SVG مبنية يدوياً (لا مكتبات خارجية) — كل رسم يُبنى من البيانات فقط.
   ========================================================================== */
const CH = (function () {
  const C = {
    gold: "#DDBF87", gold2: "#F0DBAA",
    navy: "#0E1D36", navy2: "#33557F",
    emerald: "#62C2A2", burgundy: "#D9777F",
    blue: "#7FA8D9", teal: "#5FA8A0",
    muted: "#93A1B8", line: "rgba(201,169,106,.22)"
  };
  const TCOL = "var(--text)";
  const MUT = "var(--muted)";

  function el(tag, attrs, inner) {
    let s = "<" + tag;
    for (const k in attrs) s += ` ${k}="${attrs[k]}"`;
    s += ">" + (inner || "") + "</" + tag + ">";
    return s;
  }

  /* خريطة قيم → إحداثيات */
  function scale(vals, max, min, lo, hi) {
    const span = (max - min) || 1;
    return v => lo + (hi - lo) * (1 - (v - min) / span);
  }
  /* موضع أفقي آمن: نقطة واحدة تتوسط الرسم بدل القسمة على صفر */
  function xt(i, len) { return len <= 1 ? 0.5 : i / (len - 1); }
  function niceMax(v) {
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 1.25, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) {
      if (v <= m * p) return m * p;
    }
    return 10 * p;
  }

  const defs = `
    <defs>
      <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C9A96A" stop-opacity=".95"/>
        <stop offset="100%" stop-color="#8A6B33" stop-opacity=".75"/>
      </linearGradient>
      <linearGradient id="gNavy" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2E4A7A" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#12233F" stop-opacity=".85"/>
      </linearGradient>
      <linearGradient id="gEmerald" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4FA98B" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#2C6B57" stop-opacity=".8"/>
      </linearGradient>
      <linearGradient id="gBurgundy" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C0535E" stop-opacity=".9"/>
        <stop offset="100%" stop-color="#7A2F38" stop-opacity=".85"/>
      </linearGradient>
      <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C9A96A" stop-opacity=".18"/>
        <stop offset="100%" stop-color="#C9A96A" stop-opacity="0"/>
      </linearGradient>
    </defs>`;

  function frame(w, h, labels, yTicks, opts) {
    opts = opts || {};
    const L = opts.left || 66, R = opts.right || 30, T = opts.top || 36, B = opts.bottom || 36;
    const XIN = opts.xInset || 0;
    let s = defs;
    /* خطوط شبكة أفقية + تسميات */
    for (const tk of yTicks) {
      const y = tk.y;
      s += el("line", { x1: L, y1: y, x2: w - R, y2: y, stroke: C.line, "stroke-width": 1 });
      s += el("text", { x: L - 8, y: y + 4, "text-anchor": "end", "font-size": 12, fill: MUT, "font-family": "Cairo" }, tk.label);
    }
    /* تسميات المحور الأفقي */
    const xPos = v => L + XIN + (w - L - R - XIN) * v;
    labels.forEach((lb, i) => {
      const x = labels.length === 1 ? (L + (w - L - R) / 2) : xPos(i / (labels.length - 1));
      s += el("text", { x, y: h - 8, "text-anchor": "middle", "font-size": 12.5, fill: TCOL, "font-family": "Cairo", "font-weight": 700 }, lb);
    });
    /* محاور */
    s += el("line", { x1: L, y1: T, x2: L, y2: h - B, stroke: C.line });
    s += el("line", { x1: L, y1: h - B, x2: w - R, y2: h - B, stroke: C.line });
    return { svg: s, L, R, T, B, xPos };
  }

  /* ---------- خطوط (Line) مع مساحة ---------- */
  function lineChart(opts) {
    const w = opts.width || 760, h = opts.height || 300;
    const labels = opts.labels;
    const series = opts.series.map(sr => ({
      name: sr.name, color: sr.color, dash: sr.dash || null,
      data: sr.data.map(v => (v === null ? null : v))
    }));
    let max = 0, min = 0;
    series.forEach(sr => sr.data.forEach(v => {
      if (v !== null) { if (v > max) max = v; if (v < min) min = v; }
    }));
    if (max === 0 && min === 0) max = 1;
    /* بيانات سالبة بالكامل (بدون حدود صريحة): مقياس سالب كامل يملأ الرسم */
    const allNeg = opts.yMin === undefined && opts.yMax === undefined && max === 0 && min < 0;
    if (opts.yMin !== undefined) min = opts.yMin;
    if (opts.yMax !== undefined) max = opts.yMax;
    let nMax, nMin;
    if (allNeg) {
      nMax = 0;
      nMin = -niceMax(Math.abs(min) * 1.08);
    } else {
      nMax = niceMax(Math.max(Math.abs(max), Math.abs(min)) * 1.08);
      nMin = min < 0 ? -nMax : 0;
    }
    if (opts.yRange) { nMin = opts.yRange[0]; nMax = opts.yRange[1]; }
    const T0 = 36, B0 = 36;
    const yTicks = [];
    for (let i = 0; i <= 4; i++) {
      const v = nMin + (nMax - nMin) * i / 4;
      yTicks.push({ y: T0 + (h - T0 - B0) * (opts.invertY ? (v - nMin) / (nMax - nMin) : 1 - (v - nMin) / (nMax - nMin)), v, label: opts.yFmt ? opts.yFmt(v) : E.fmt(v) });
    }
    const fr = frame(w, h, labels, yTicks, {});
    const yPos = opts.invertY ? scale([0, 1], nMax, nMin, h - fr.B, fr.T) : scale([0, 1], nMax, nMin, fr.T, h - fr.B);
    let svg = fr.svg;
    /* تمريرة أولى: جمع مواضع النقاط */
    const allPts = series.map(sr => sr.data.map((v, i) => {
      if (v === null) return null;
      return { v, i, x: fr.xPos(xt(i, sr.data.length)), y: yPos(v) };
    }));
    series.forEach((sr, si) => {
      let path = "", area = "", first = true, hasNull = false;
      sr.data.forEach((v, i) => {
        if (v === null) { hasNull = true; return; }
        const x = fr.xPos(xt(i, sr.data.length)), y = yPos(v);
        path += (first ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
        if (first) area = `M${x.toFixed(1)} ${(h - fr.B).toFixed(1)} L${x.toFixed(1)} ${y.toFixed(1)} `;
        else area += `L${x.toFixed(1)} ${y.toFixed(1)} `;
        first = false;
      });
      area += `L${fr.xPos(xt(sr.data.length - 1, sr.data.length)).toFixed(1)} ${(h - fr.B).toFixed(1)} Z`;
      if (sr.area !== false && !hasNull) {
        svg += el("path", { d: area, fill: "url(#gArea)", stroke: "none" });
      }
      svg += el("path", { d: path.trim(), fill: "none", stroke: sr.color, "stroke-width": 2.4, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": sr.dash || "" });
      const pts = allPts[si];
      pts.forEach((p, idx) => {
        if (!p) return;
        const { v, i, x, y } = p;
        svg += el("circle", { cx: x, cy: y, r: 4, fill: "var(--panel)", stroke: sr.color, "stroke-width": 2.2 });
        svg += el("title", {}, `${sr.name} · ${labels[i]} · ${opts.yFmt ? opts.yFmt(v) : E.fmt(v)}`);
      });
    });
    /* تمريرة ثانية: تسميات مفصولة رأسياً دائماً وبلا تلامس مع النقاط
       - سلسلتان: تسمية السلسلة الأعلى فوقها بمسافة، وتسمية الأدنى تحتها بمسافة
       - ثلاث سلاسل فأكثر: ترتيب تسميات الشهر رأسياً حسب ارتفاع نقاطها */
    if (opts.valueLabels) {
      series.forEach((sr, si) => {
        allPts[si].forEach((p, idx) => {
          if (!p) return;
          const { v, i, x, y } = p;
          let labelY = y;
          if (series.length === 2) {
            const other = allPts[1 - si][idx];
            if (other && other.y !== undefined) {
              const topY = Math.min(y, other.y), botY = Math.max(y, other.y);
              if (y === topY) {
                labelY = topY - 14;
              } else {
                labelY = botY + 22;
              }
            } else {
              labelY = y - 14;
            }
          } else if (series.length > 2) {
            /* ثلاث سلاسل أو أكثر: كل تسميات الشهر تترص فوق أعلى نقطة في المجموعة
               (بعيداً عن كل الدوائر) — بترتيب ارتفاع النقاط من الأعلى للأسفل،
               وعند الاقتراب من حافة الرسم تتحرك المجموعة كلها ككتلة واحدة */
            const group = [];
            for (let s2 = 0; s2 < series.length; s2++) {
              const p2 = allPts[s2][idx];
              if (p2) group.push({ si: s2, y: p2.y });
            }
            group.sort((a, b) => a.y - b.y);
            const myPos = group.findIndex(g => g.si === si);
            const k = group.length;
            /* الوضع الطبيعي: كل التسميات فوق أعلى نقطة في المجموعة.
               لو المجموعة قريبة جداً من حافة الرسم العلوية:
               تتحول التسميات كلها تحت أدنى نقطة (بلا لمس أي دائرة). */
            const aboveBottom = group[0].y - 14 - (k - 1) * 20;
            if (aboveBottom < fr.T + 10) {
              const belowTop = group[k - 1].y + 22 + (k - 1) * 20;
              let extra = 0;
              if (belowTop > h - fr.B - 8) extra = (h - fr.B - 8) - belowTop;
              labelY = group[k - 1].y + 22 + myPos * 20 + extra;
            } else {
              labelY = group[0].y - 14 - myPos * 20;
            }
          } else {
            labelY = y - 14;
          }
          if (labelY < fr.T + 8) labelY = fr.T + 8;
          if (labelY > h - fr.B - 6) labelY = h - fr.B - 6;
          const isFirst = i === 0, isLast = i === allPts[si].length - 1;
          let labelX = x, anchor = "middle";
          if (isFirst) { labelX = x + 8; anchor = "start"; }
          else if (isLast) { labelX = x - 8; anchor = "end"; }
          svg += el("text", { x: labelX, y: labelY, "text-anchor": anchor, "font-size": 10.5, fill: sr.color, stroke: "#0E1D36", "stroke-width": 3, "paint-order": "stroke", "font-family": "Cairo", "font-weight": 700 }, opts.yFmt ? opts.yFmt(v) : E.fmt(v));
        });
      });
    }
    return wrap(w, h, svg, opts.legend);
  }

  /* ---------- أعمدة ---------- */
  function colChart(opts) {
    const w = opts.width || 760, h = opts.height || 300;
    const labels = opts.labels;
    const series = opts.series;
    let max = 0, min = 0;
    series.forEach(sr => sr.data.forEach(v => {
      if (v !== null) { if (v > max) max = v; if (v < min) min = v; }
    }));
    if (opts.yMax !== undefined) max = opts.yMax;
    if (opts.yMin !== undefined) min = opts.yMin;
    const nMax = niceMax(Math.max(Math.abs(max), Math.abs(min)) * 1.06);
    const nMin = min < 0 ? -nMax : 0;
    const T0 = 36;
    const extraBottom = (opts.valueLabels && series.length > 1) ? (series.length - 1) * 19 + 12 : 0;
    const B0 = 34 + extraBottom;
    const yTicks = [];
    for (let i = 0; i <= 4; i++) {
      const v = nMin + (nMax - nMin) * i / 4;
      yTicks.push({ y: T0 + (h - T0 - B0) * (opts.invertY ? (v - nMin) / (nMax - nMin) : 1 - (v - nMin) / (nMax - nMin)), v, label: opts.yFmt ? opts.yFmt(v) : E.fmt(v) });
    }
    /* أعمدة متعددة بأرقام: مساحة سفلية إضافية حتى لا تتداخل الأرقام مع أسماء الشهور */
    const fr = frame(w, h, labels, yTicks, { bottom: B0, xInset: 24 + series.length * 20 });
    const yPos = opts.invertY ? scale([0, 1], nMax, nMin, h - fr.B, fr.T) : scale([0, 1], nMax, nMin, fr.T, h - fr.B);
    let svg = fr.svg;
    const n = labels.length, k = series.length;
    const slot = (w - fr.L - fr.R) / n;
    const bw = Math.min(46, slot * 0.6 / k);
    series.forEach((sr, si) => {
      sr.data.forEach((v, i) => {
        if (v === null) {
          svg += el("text", { x: fr.xPos(xt(i, n)), y: (h - fr.B) / 2 + fr.T, "text-anchor": "middle", "font-size": 9, fill: MUT, "font-family": "Cairo" }, "…");
          return;
        }
        const cx = fr.xPos(xt(i, n));
        const x = cx - (k * bw) / 2 + si * bw + bw * 0.06;
        const y0 = yPos(Math.max(0, nMin)), y1 = yPos(v);
        const yTop = Math.min(y0, y1), yH = Math.max(2, Math.abs(y1 - y0));
        const fill = opts.useSignColor ? (v < 0 ? "url(#gBurgundy)" : "url(#gEmerald)") : sr.fill;
        svg += el("rect", { x: x.toFixed(1), y: yTop.toFixed(1), width: (bw * 0.88).toFixed(1), height: yH.toFixed(1), rx: 4, fill, stroke: sr.stroke || "none", "stroke-width": 1 });
        svg += el("title", {}, `${sr.name} · ${labels[i]} · ${opts.yFmt ? opts.yFmt(v) : E.fmt(v)}`);
        if (opts.valueLabels) {
          if (k === 1) {
            /* سلسلة واحدة: الرقم فوق العمود (داخل منطقة الرسم) — بلا تلامس مع الأعمدة المجاورة */
            let ly = yTop - 8;
            if (ly < fr.T + 8) ly = fr.T + 8;
            if (ly > h - fr.B - 6) ly = h - fr.B - 6;
            svg += el("text", { x: cx, y: ly, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)", "font-family": "Cairo", "font-weight": 700 }, opts.yFmt ? opts.yFmt(v) : E.fmt(v));
          } else {
            /* متعدد السلاسل: الرقم تحت العمود (فوق المحور) بشكل متدرج */
            svg += el("text", { x: cx + (si - (k - 1) / 2) * bw, y: y0 + 12 + si * 19, "text-anchor": "middle", "font-size": 9.5, fill: "var(--muted)", "font-family": "Cairo", "font-weight": 700 }, opts.yFmt ? opts.yFmt(v) : E.fmt(v));
          }
        }
      });
    });
    return wrap(w, h, svg, opts.legend);
  }

  /* ---------- أعمدة + خط (Combo) ----------
     الأعمدة قد تكون سالبة (قاعدة الإشارات: الربح الإجمالي بالسالب)
     → مقياس متماثل حول الصفر مثل colChart */
  function comboChart(opts) {
    const w = opts.width || 760, h = opts.height || 300;
    const labels = opts.labels;
    const col = opts.columns[0];
    const line = opts.line;
    let maxC = 0, minC = 0;
    col.data.forEach(v => {
      if (v !== null) { if (v > maxC) maxC = v; if (v < minC) minC = v; }
    });
    if (opts.yMaxC !== undefined) maxC = opts.yMaxC;
    if (opts.yMinC !== undefined) minC = opts.yMinC;
    const nMaxC = niceMax(Math.max(Math.abs(maxC), Math.abs(minC)) * 1.1);
    const nMinC = minC < 0 ? -nMaxC : 0;
    const T0 = 36, B0 = 36;
    const yTicksC = [0, 0.25, 0.5, 0.75, 1].map(t => {
      const v = nMinC + (nMaxC - nMinC) * t;
      return { y: T0 + (h - T0 - B0) * (opts.invertY ? t : 1 - t), v, label: opts.yFmtC(v) };
    });
    const fr = frame(w, h, labels, yTicksC, { left: 70, xInset: 24 });
    const yC = opts.invertY ? scale([0, 1], nMaxC, nMinC, h - fr.B, fr.T) : scale([0, 1], nMaxC, nMinC, fr.T, h - fr.B);
    const nMaxL = opts.yMaxL || 100, nMinL = opts.yMinL !== undefined ? opts.yMinL : 0;
    const yL = scale([0, 1], nMaxL, nMinL, fr.T, h - fr.B);
    let svg = fr.svg;
    const n = labels.length;
    const slot = (w - fr.L - fr.R) / n;
    const bw = Math.min(46, slot * 0.55);
    col.data.forEach((v, i) => {
      if (v === null) return;
      const cx = fr.xPos(xt(i, n));
      const x = cx - bw / 2;
      const y0 = yC(Math.max(0, nMinC)), y1 = yC(v);
      const yTop = Math.min(y0, y1), yH = Math.max(2, Math.abs(y1 - y0));
      svg += el("rect", { x: x.toFixed(1), y: yTop.toFixed(1), width: bw.toFixed(1), height: yH.toFixed(1), rx: 4, fill: col.fill });
      svg += el("title", {}, `${col.name} · ${labels[i]} · ${opts.yFmtC(v)}`);
      if (opts.colLabels) svg += el("text", { x: cx, y: yTop - 6, "text-anchor": "middle", "font-size": 10.5, fill: "var(--text)", "font-family": "Cairo", "font-weight": 700 }, opts.yFmtC(v));
      if (opts.valueLabels) {
        const lastCol = i === n - 1;
        svg += el("text", { x: lastCol ? cx - bw / 2 - 7 : cx + bw / 2 + 7, y: yTop + 10, "text-anchor": lastCol ? "end" : "start", "font-size": 10.5, fill: "var(--muted)", "font-family": "Cairo", "font-weight": 700 }, opts.yFmtC(v));
      }
    });
    /* خط الهامش */
    let path = "";
    const pts = [];
    line.data.forEach((v, i) => {
      if (v === null) return;
      const x = fr.xPos(xt(i, line.data.length)), y = yL(v);
      path += (pts.length ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      pts.push({ x, y, v, i });
    });
    svg += el("path", { d: path, fill: "none", stroke: line.color, "stroke-width": 2.4, "stroke-dasharray": line.dash || "", "stroke-linecap": "round" });
    pts.forEach(p => {
      svg += el("circle", { cx: p.x, cy: p.y, r: 3.2, fill: "var(--panel)", stroke: line.color, "stroke-width": 2 });
      /* تسمية الهامش فوق أعلى عنصر (العمود أو نقطة الخط) — بلا تلامس مع أي منهما */
      const colV = col.data[p.i];
      const colTop = (colV !== null && colV !== undefined) ? Math.min(yC(Math.max(0, nMinC)), yC(colV)) : fr.T;
      const labelY = Math.max(fr.T + 8, Math.min(colTop, p.y) - 15);
      if (!opts.noLineLabels) svg += el("text", { x: p.x, y: labelY, "text-anchor": "middle", "font-size": 10.5, fill: line.color, "font-family": "Cairo", "font-weight": 700 }, opts.yFmtL(p.v));
    });
    return wrap(w, h, svg, opts.legend);
  }

  /* ---------- أشرطة أفقية ---------- */
  function hbarChart(opts) {
    const items = opts.items;
    const w = opts.width || 760, hh = opts.rowH || 38;
    const h = items.length * hh + 18;
    const L = opts.left || 155, R = 150;
    const max = Math.max(...items.map(i => i.value)) || 1;
    let svg = defs;
    items.forEach((it, i) => {
      const y = 10 + i * hh;
      const bw2 = (w - L - R) * (it.value / max);
      svg += el("text", { x: L - 10, y: y + hh / 2 + 5, "text-anchor": "end", "font-size": 13, fill: TCOL, "font-family": "Cairo", "font-weight": 700 }, it.label);
      svg += el("rect", { x: L, y, width: Math.max(2, bw2), height: hh - 12, rx: 5, fill: it.color || "url(#gGold)" });
      svg += el("title", {}, `${it.label} · ${opts.fmt(it.value)}${it.pct !== undefined ? " · " + E.fmtPct(it.pct) : ""}`);
      svg += el("text", { x: L + Math.max(2, bw2) + 10, y: y + hh / 2 + 5, "font-size": 13, fill: TCOL, "font-family": "Cairo", "font-weight": 800 }, opts.fmt(it.value) + (it.pct !== undefined ? ` · ${E.fmtPct(it.pct)}` : ""));
    });
    return wrap(w, h, svg);
  }

  /* ---------- دونات ---------- */
  function donutChart(opts) {
    const size = opts.size || 240, cx = size / 2, cy = size / 2, r = size / 2 - 14, ir = r * 0.62;
    const total = opts.segments.reduce((s, g) => s + g.value, 0) || 1;
    let angle = -Math.PI / 2;
    let svg = defs;
    opts.segments.forEach(seg => {
      const frac = seg.value / total;
      const a2 = angle + frac * Math.PI * 2;
      const large = frac > 0.5 ? 1 : 0;
      const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      const x3 = cx + ir * Math.cos(a2), y3 = cy + ir * Math.sin(a2);
      const x4 = cx + ir * Math.cos(angle), y4 = cy + ir * Math.sin(angle);
      const d = `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} L${x3.toFixed(1)} ${y3.toFixed(1)} A${ir} ${ir} 0 ${large} 0 ${x4.toFixed(1)} ${y4.toFixed(1)} Z`;
      svg += el("path", { d, fill: seg.color, "fill-opacity": seg.opacity || 1, stroke: "var(--panel)", "stroke-width": 2 });
      svg += el("title", {}, `${seg.label} · ${opts.fmt(seg.value)} · ${E.fmtPct(seg.value / total * 100)}`);
      angle = a2;
    });
    svg += el("text", { x: cx, y: cy - 22, "text-anchor": "middle", "font-size": 13, fill: MUT, "font-family": "Cairo" }, opts.centerLabel || "");

/* خلفية الفترة الحالية: تسميات النطاق */
function scopeLabel(scope, year) {
  year = year || 2026;
  if (scope.period === "month") return "شهر واحد — " + E.monthAr(scope.monthKey) + " " + year;
  if (scope.period === "janapr") return "يناير – أبريل " + year;
  if (scope.period === "janjul") return "يناير – يوليو " + year;
  const av = E.available(year);
  const last = av.length ? E.monthAr(av[av.length - 1]) : "—";
  let label = `التراكمي — يناير–${last} ${year}`;
  if (year === 2026) {
    const shared = E.sharedMonths(scope).length;
    const n26 = E.scopeAvailableMonths(2026, scope).length;
    const n25 = E.scopeAvailableMonths(2025, scope).length;
    if (shared < n26 || shared < n25) label += ` · مقارنة 2025 على ${shared} أشهر مشتركة`;
  }
  return label;
}
function commonPeriodLabel(scope) {
  const shared = E.sharedMonths(scope);
  if (!shared.length) return "لا توجد أشهر مشتركة";
  if (shared.length === 1) return `${E.monthAr(shared[0])} (شهر مشترك)`;
  return `${E.monthAr(shared[0])}–${E.monthAr(shared[shared.length - 1])} (${shared.length} أشهر مشتركة)`;
}
function scopeNote(scope) {
  const av26 = E.available(2026);
  const av25 = E.available(2025);
  const calendarKeys = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  const monthNames = { oct: "أكتوبر", nov: "نوفمبر", dec: "ديسمبر" };
  const monthName = k => monthNames[k] || E.monthAr(k);
  if (calendarKeys.every(k => av26.includes(k) && av25.includes(k))) return "";
  const missing = calendarKeys.filter(k => !av26.includes(k) || !av25.includes(k)).map(monthName).join("، ");
  const shared = E.sharedMonths(scope);
  const end26 = av26.length ? E.monthAr(av26[av26.length - 1]) : "لا توجد بيانات";
  const end25 = av25.length ? E.monthAr(av25[av25.length - 1]) : "لا توجد بيانات";
  const comparisonUsesBalance = E.hasPublishedScope(2026, scope) && E.hasPublishedScope(2025, scope);
  const comparisonBasis = comparisonUsesBalance
    ? "وتستخدم المقارنة Balance المنشور للسنتين على هذه الفترة."
    : "وتستخدم المقارنة مجاميع الأشهر في السنتين؛ لا يتوفر Balance منشور كامل لعام 2025. ";
  return "";
}

    const cum = (year, metric) => {

        return ms.map(k => {
          const index = E.monthOrder.indexOf(k);
          const d = FIN.years[year][k];
          if (!d) return null;
          return E.monthOrder.slice(0, index + 1).reduce((acc, m) => {
            const month = FIN.years[year][m];
            return acc + (month && month[metric] != null ? month[metric] : 0);
          }, 0);
        });
      }
      let acc = 0;

        const d = FIN.years[year][k];

      });
    };
    const rev26 = cum(2026, "revenue"), rev25 = cum(2025, "revenue");
    const nl26 = cum(2026, "netLoss"), nl25 = cum(2025, "netLoss");
    const revArr = ms.map(k => FIN.years[2026][k].revenue);

/* ============================================================================
   NATURAL SCENT TRADING QATAR — APPLICATION SHELL
   شاشة دخول (كلمة المرور: 2026) → الداشبورد كاملة
   الشريط الجانبي: درج يفتح ويغلق (غير مثبت) · بدون شريط علوي · بدون بحث/طباعة
   أنيميشن دخول + عدّاد أرقام (Count-up) + أنيميشن لبنود القائمة
   ========================================================================== */
const App = (function () {

  const PASSWORD = "2026";
  /* توحيد الأرقام: يقبل العربية (٢٠٢٦) والإنجليزية (2026) */
  const normalizeDigits = s => (s || "").replace(/[٠-٩]/g, d => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)))
                                         .replace(/[۰-۹]/g, d => String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)));
  const checkPassword = v => normalizeDigits(v).trim() === PASSWORD;
  let unlockedMem = false;   /* فتح الجلسة — يعمل حتى لو كان التخزين محظوراً */

  /* تخزين آمن يعمل في أي بيئة */
  const store = {
    get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} },
    remove(k) { try { window.localStorage.removeItem(k); } catch (e) {} }
  };
  const isUnlocked = () => unlockedMem || store.get("nstq-auth") === "1";

  /* اللوجو الرسمي (صورة مدمجة بخلفية شفافة) — بتوهج وضوء يجري على الحواف */
  const LOGO = `<div class="logo-img-wrap"><img src="${typeof LOGO_IMG !== "undefined" ? LOGO_IMG : ""}" class="logo-img" alt="سميل اند سمايل"><span class="logo-sheen"></span></div>`;
  const WORD = `<div class="logo-word">سميل اند سمايل</div><div class="logo-word-en">SMELL & SMILE</div>`;

    "trend-analysis": `<svg viewBox="0 0 24 24"><path d="M2 14c3-4 6 4 9 0s6 2 11-4"/><path d="M2 20h20"/></svg>`,
    "financial-risk": `<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M12 8v5M12 16.5h.01"/></svg>`,
    "key-findings": `<svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14" opacity="0"/><path d="M9 4l2 3 2-3M9 20l2-3 2 3"/><path d="M9 9h6v6H9z"/></svg>`,
    "risks": `<svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>`,
    "opportunities": `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>`,
    "recommendations": `<svg viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0-9-9"/><path d="M3 12L8 7l-2.5 5z" transform="translate(-1,0)"/><path d="M8 10l1.5-1.5L11 10l-1.5 1.5z"/></svg>`,
    "action-plan": `<svg viewBox="0 0 24 24"><path d="M5 21V4l14 6-14 6"/></svg>`,
    "charts-gallery": `<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M7 20h10M12 16v4"/></svg>`
  };

  const $ = s => document.querySelector(s);
  const navEl = $("#nav"), pageEl = $("#page");

  /* ---------- بناء الشريط الجانبي ---------- */
  function buildNav() {
    const logo = $("#brand-logo");
    if (logo) logo.innerHTML = WORD_SIDEBAR;
    let html = "";
    NAV.forEach(gr => {
      html += `<div class="nav-group"><div class="nav-group-label"><span class="ng-ar">${gr.ar}</span><span class="ng-en">${gr.en}</span></div>`;
      gr.items.forEach(it => {
        html += `<div class="nav-item" data-page="${it.id}">
          ${ICONS[it.id] || ""}<span class="ni-ar">${it.ar}</span><span class="ni-en">${it.en}</span>
        </div>`;
      });
      html += "</div>";
    });
    navEl.innerHTML = html;
    navEl.addEventListener("click", e => {
      const item = e.target.closest(".nav-item");
      if (item) { go(item.dataset.page); closeSidebar(); }
    });
    $("#brand-home").addEventListener("click", () => { go("exec-overview"); closeSidebar(); });
  }

  /* ---------- التوجيه ---------- */
  function go(pageId) {
    if (pageId !== "cover" && !isUnlocked()) pageId = "cover";
    ST.page = pageId;
    try { location.hash = pageId === "cover" ? "" : pageId; } catch (e) {}
    render();
  }
  function render() {
    document.body.classList.toggle("is-locked", ST.page === "cover");
    document.querySelectorAll(".nav-item").forEach(n => n.classList.toggle("active", n.dataset.page === ST.page));
    if (ST.page === "cover") {
      closeSidebar();
      pageEl.innerHTML = "";
      renderCover();
      return;
    }
    const def = PAGES[ST.page];
    if (!def) { go("exec-overview"); return; }
    pageEl.innerHTML = "";
    const wrap = document.createElement("div");
    pageEl.appendChild(wrap);
    def.render(wrap, ST);
    bindPageEvents();
    ANIM.run(wrap);
    try { window.scrollTo({ top: 0 }); } catch (e) {}
  }

  function bindPageEvents() {
    pageEl.querySelectorAll("[data-goto]").forEach(el => {
      el.addEventListener("click", e => {
        if (e.target.closest(".tip")) return;
        const g = el.getAttribute("data-goto");
        if (g) go(g);
      });
    });
    const stmtSeg = $("#stmt-year");
    if (stmtSeg) stmtSeg.addEventListener("click", e => {
      const b = e.target.closest(".seg-btn");
      if (b) { ST.stmtYear = parseInt(b.dataset.y, 10); render(); }
    });
    const wfSeg = $("#wf-year");
    if (wfSeg) wfSeg.addEventListener("click", e => {
      const b = e.target.closest(".seg-btn");
      if (b) { ST.wfYear = parseInt(b.dataset.y, 10); render(); }
    });
  }

  /* ---------- شاشة الدخول (الغلاف + كلمة المرور) ---------- */
  let coverCount = 0;
  function renderCover() {
    pageEl.innerHTML = `
    <div class="cover q-pattern" style="background-image:url('${COVER_IMG}')">
      <div class="cover-inner cover-lock-layout">
        <div class="cover-brand-lg">
          <div class="logo-drop" id="logo-drop">
            ${LOGO}
            ${WORD}
          </div>
          <div class="cb-en-lg">NATURAL SCENT TRADING QATAR</div>
          <div class="cb-sub-lg">الدوحة · قطر — DOHA · QATAR</div>
        </div>
        <div class="pw-card" id="pw-card">
          <div class="pw-lock-icon"><svg viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3M5 10h14v11H5z"/></svg></div>
          <div class="pw-label">هذا التقرير خاص بالإدارة — أدخل كلمة المرور للدخول</div>
          <input type="password" id="pw-input" inputmode="numeric" placeholder="••••" autocomplete="off">
          <button class="btn-enter pw-btn" id="pw-btn">دخول التقرير المالي</button>
          <div id="pw-error" class="pw-error hidden">كلمة المرور غير صحيحة</div>
        </div>
        <div class="pw-credits">المراجع: <b>إيهاب محمد جلال</b></div>
      </div>
    </div>`;
    /* اهتزاز الشاشة لحظة الارتكاز (بدون صوت تلقائي) */
    setTimeout(() => {
      const cv = document.querySelector(".cover");
      if (cv) { cv.classList.add("landing-shake"); setTimeout(() => cv.classList.remove("landing-shake"), 500); }
    }, 700);
  }

  function initLock() {
    const submit = () => {
      const inp = $("#pw-input");
      const v = inp ? inp.value : "";
      if (checkPassword(v)) {
        unlockedMem = true;
        store.set("nstq-auth", "1");
        go("exec-overview");
      } else {
        /* رسالة الخطأ تظهر فقط عند إدخال خاطئ فعلي — ليست تلقائية */
        if (v.trim() !== "") {
          const err = $("#pw-error");
          if (err) err.classList.remove("hidden");
        }
        const card = $("#pw-card");
        if (card) { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
        if (inp) { inp.value = ""; inp.focus(); }
      }
    };
    document.addEventListener("click", e => { if (e.target.closest("#pw-btn")) submit(); });
    document.addEventListener("keydown", e => { if (e.key === "Enter" && ST.page === "cover") submit(); });
  }

  /* ---------- الشريط الجانبي: درج يفتح ويغلق ---------- */
  function initSidebar() {
    const sidebar = $("#sidebar"), backdrop = $("#sidebar-backdrop"), fab = $("#fab-menu");
    const open = () => {
      sidebar.classList.add("open");
      document.body.classList.add("sidebar-open");
      backdrop.classList.add("show");
    };
    const close = () => {
      sidebar.classList.remove("open");
      document.body.classList.remove("sidebar-open");
      backdrop.classList.remove("show");
    };
    if (fab) fab.addEventListener("click", open);
    if (backdrop) backdrop.addEventListener("click", close);
    document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  }
  function closeSidebar() {
    const sidebar = $("#sidebar"), backdrop = $("#sidebar-backdrop");
    if (sidebar) sidebar.classList.remove("open");
    document.body.classList.remove("sidebar-open");
    if (backdrop) backdrop.classList.remove("show");
  }

  /* ---------- التوجيه الافتتاحي ---------- */
  function initRouter() {
    let h = "";
    try { h = location.hash.replace(/^#\/?/, ""); } catch (e) {}
    ST.page = (h && PAGES[h]) ? h : ST.page;
    if (ST.page !== "cover" && !isUnlocked()) ST.page = "cover";
    window.addEventListener("hashchange", () => {
      let p = "";
      try { p = location.hash.replace(/^#\/?/, ""); } catch (e) {}
      if (p && PAGES[p]) { ST.page = p; render(); }
    });
  }

  function init() {
    buildNav();
    initLock();
    initSidebar();
    initRouter();
    render();
  }

  return { go, ST, init, checkPassword };
})();

/* ============================================================================
   ANIM — أنيميشن الدخول + عدّاد الأرقام (Count-up)
   ========================================================================== */
const ANIM = (function () {
  const raf = window.requestAnimationFrame || (cb => setTimeout(() => cb(Date.now()), 16));

  /* العناصر التي يتحرك عدّاد أرقامها */
  const COUNT_SEL = ".cnt-num, .kpi-value, .kpi2-value, .stage-value, .wf-stat, .eff-value, .ratio-result, .sc-metric, .tbl .num.strong, .tbl .ytd";

  /* العناصر التي تدخل بحركة متتابعة */
  const STAGGER_SEL = ".sec-head, .hero-copy, .hero-card, .kpi-primary, .kpi-secondary, .panel, .stage, .ratio-card, .eff-card, .signal-card, .finding, .opp-card, .risk-card, .rec-group, .insight, .focus";

  function parseNum(txt) {
    const m = (txt || "").trim().match(/^([^0-9-]*?)(-?[\d,]+(?:\.\d+)?)(.*)$/);
    if (!m) return null;
    const numStr = m[2].replace(/,/g, "");
    const v = parseFloat(numStr);
    if (isNaN(v)) return null;
    return { prefix: m[1], v, dec: (numStr.split(".")[1] || "").length, suffix: m[3] };
  }
  function fmtNum(v, dec) {
    const neg = v < 0;
    return (neg ? "-" : "") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }

  function countUp(el, p) {
    const dur = 1000;
    let t0 = null;
    const step = ts => {
      if (t0 === null) t0 = ts;
      const t = Math.min((ts - t0) / dur, 1);
      const e = 1 - Math.pow(1 - t, 3);   /* easeOutCubic */
      el.textContent = p.prefix + fmtNum(p.v * e, p.dec) + p.suffix;
      if (t < 1) raf(step);
      else el.textContent = p.prefix + fmtNum(p.v, p.dec) + p.suffix;
    };
    raf(step);
  }

  function run(root) {
    if (!root || !root.querySelectorAll) return;
    /* 1) دخول متتابع */
    let i = 0;
    root.querySelectorAll(STAGGER_SEL).forEach(el => {
      el.classList.add("anim");
      el.style.animationDelay = Math.min(i * 55, 650) + "ms";
      i++;
    });
    /* 2) عدّاد الأرقام */
    root.querySelectorAll(COUNT_SEL).forEach(el => {
      const p = parseNum(el.textContent);
      if (p) countUp(el, p);
    });
  }

  return { run };
})();

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => App.init());
  } else {
    App.init();
  }
})();
